<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protokół Inspekcji Trasy – KRKEN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- heic2any (konwerter HEIC) jest ładowany leniwie z JS, tylko gdy faktycznie
     trafi się plik HEIC — to ~600KB WebAssembly i jego wczytanie na starcie
     potrafiło zawiesić resztę strony na słabszym łączu w terenie. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f0f0;
    padding: 16px;
  }

  .print-bar {
    max-width: 820px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .btn-print {
    padding: 12px 24px;
    background: #e85d04;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 160px;
  }
  .btn-print:hover { background: #c94e00; }
  .btn-clear {
    padding: 12px 20px;
    background: transparent;
    color: #666;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-clear:hover { border-color: #999; color: #333; }

  /* spinner overlay */
  .spinner-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: #fff;
    font-size: 1rem;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .spinner-overlay.active { display: flex; }
  .spinner {
    width: 48px; height: 48px;
    border: 5px solid rgba(255,255,255,0.3);
    border-top-color: #e85d04;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .doc {
    max-width: 820px;
    margin: 0 auto;
    background: #fff;
    padding: 32px 36px;
    border-radius: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }

  .doc-header {
    border-bottom: 3px solid #e85d04;
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .doc-title { font-size: 1.4rem; font-weight: 800; color: #1a1a1a; }

  .section { margin-bottom: 30px; }
  .section-title {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: #e85d04; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #e8e8e8; }

  .field-row { display: grid; gap: 12px; margin-bottom: 10px; }
  .field-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .field-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .field-row.cols-1 { grid-template-columns: 1fr; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.68rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
  .field-line {
    border: none; border-bottom: 1.5px solid #d0d0d0;
    padding: 6px 2px; font-size: 0.9rem; font-family: inherit;
    color: #1a1a1a; background: transparent; width: 100%; outline: none;
    transition: border-color 0.15s;
  }
  .field-line:focus { border-bottom-color: #e85d04; }
  .field-line-lg { font-size: 1.25rem; font-weight: 700; padding: 8px 2px; }
  .field-area {
    border: 1.5px solid #d0d0d0; border-radius: 4px;
    padding: 8px 10px; font-size: 0.88rem; font-family: inherit;
    color: #1a1a1a; background: transparent; width: 100%;
    outline: none; resize: vertical; min-height: 70px;
    transition: border-color 0.15s;
  }
  .field-area:focus { border-color: #e85d04; }

  /* SKALA STANU */
  .status-scale { display: flex; gap: 6px; }
  .status-option { display: none; }
  .status-option + label {
    flex: 1; text-align: center; padding: 10px 4px 8px;
    border: 2px solid #e0e0e0; border-radius: 6px; cursor: pointer;
    font-size: 0.76rem; font-weight: 700; transition: all 0.15s;
    user-select: none; line-height: 1.3;
  }
  .status-option + label .num { font-size: 1.1rem; display: block; margin-bottom: 3px; }
  .status-option + label .desc { font-size: 0.6rem; font-weight: 400; opacity: 0.8; }
  #s1 + label { color: #16a34a; }
  #s2 + label { color: #65a30d; }
  #s3 + label { color: #ca8a04; }
  #s4 + label { color: #ea580c; }
  #s5 + label { color: #dc2626; }
  #s1:checked + label { background: #dcfce7; border-color: #16a34a; }
  #s2:checked + label { background: #ecfccb; border-color: #65a30d; }
  #s3:checked + label { background: #fef9c3; border-color: #ca8a04; }
  #s4:checked + label { background: #ffedd5; border-color: #ea580c; }
  #s5:checked + label { background: #fee2e2; border-color: #dc2626; }

  /* PRACE */
  .works-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .work-option { display: none; }
  .work-option + label {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px; border: 1.5px solid #e0e0e0; border-radius: 5px;
    cursor: pointer; font-size: 0.78rem; color: #444;
    transition: all 0.15s; user-select: none; line-height: 1.2;
  }
  .work-option + label::before {
    content: ''; width: 14px; height: 14px; border: 2px solid #ccc;
    border-radius: 3px; flex-shrink: 0; transition: all 0.15s;
  }
  .work-option:checked + label { border-color: #e85d04; background: #fff5ee; color: #1a1a1a; }
  .work-option:checked + label::before {
    background: #e85d04; border-color: #e85d04; content: '✓';
    color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center;
  }

  /* ZDJĘCIA */
  .photo-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 8px; }
  .photo-slot {
    border: 1.5px dashed #d0d0d0; border-radius: 6px;
    display: flex; flex-direction: column;
    overflow: hidden; cursor: pointer;
    transition: border-color 0.15s; background: #fafafa;
  }
  .photo-slot:hover { border-color: #e85d04; }
  .photo-slot.converting { opacity: 0.5; pointer-events: none; }
  .photo-slot.converting .photo-placeholder .txt::after { content: ' (konwertowanie…)'; }
  .photo-image-area {
    position: relative; aspect-ratio: 3/4;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .photo-slot input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 3; }
  .photo-placeholder { text-align: center; color: #bbb; pointer-events: none; }
  .photo-placeholder .icon { font-size: 1.6rem; margin-bottom: 4px; }
  .photo-placeholder .txt { font-size: 0.65rem; line-height: 1.4; }
  .photo-slot img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: none; background: #fff; margin: auto; }
  .photo-caption-input {
    display: none;
    border: none; border-top: 1px solid #e5e5e5;
    background: #fff; color: #444;
    padding: 6px 8px; font-size: 0.72rem; font-family: inherit;
    outline: none; width: 100%; flex-shrink: 0;
  }
  .photo-slot.has-photo .photo-caption-input { display: block; }
  .photo-slot.has-photo .photo-placeholder { display: none; }

  .protocol-num { font-size: 0.75rem; color: #bbb; text-align: right; margin-top: 16px; }

  /* MOBILE */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .doc { padding: 20px 16px; }
    .field-row.cols-3 { grid-template-columns: 1fr 1fr; }
    .field-row.cols-2 { grid-template-columns: 1fr; }
    .works-grid { grid-template-columns: 1fr 1fr; }
    .photo-section { grid-template-columns: repeat(2, 1fr); }
    .status-option + label .desc { display: none; }
    .status-option + label { padding: 10px 2px; }
    .btn-print { font-size: 0.95rem; }
  }

  /* PRINT */
  @media print {
    body { background: #fff; padding: 0; }
    .print-bar { display: none; }
    .doc { box-shadow: none; padding: 20px 24px; max-width: 100%; border-radius: 0; }
    .status-option + label, .work-option + label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .section, .photo-slot, .field-row, .status-scale, .works-grid { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="spinner-overlay" id="spinner">
  <div class="spinner"></div>
  <div>Generowanie PDF…</div>
</div>

<div class="print-bar">
  <button class="btn-clear" onclick="clearForm()">🗑 Wyczyść</button>
  <button class="btn-print" onclick="handlePrintClick()">📄 Zapisz PDF</button>
</div>

<div class="doc" id="doc">

  <div class="doc-header">
    <div class="doc-title">Protokół Inspekcji Trasy</div>
  </div>

  <!-- 1. IDENTYFIKACJA -->
  <div class="section">
    <div class="section-title">1. Identyfikacja</div>
    <div class="field-row cols-2">
      <div class="field">
        <label>Data inspekcji</label>
        <input class="field-line" type="text" id="f-date" placeholder="DD.MM.RRRR" />
      </div>
      <div class="field">
        <label>Inspektor</label>
        <input class="field-line" type="text" id="f-inspector" placeholder="Imię i nazwisko" />
      </div>
    </div>
    <div class="field-row cols-1">
      <div class="field">
        <label>Nazwa trasy</label>
        <input class="field-line field-line-lg" type="text" id="f-trail" placeholder="np. Perun, Skrzat…" />
      </div>
    </div>
    <div class="field-row cols-2">
      <div class="field">
        <label>Nr sekcji / odcinek</label>
        <input class="field-line" type="text" id="f-section" placeholder="np. Sekcja 23, Sekcja 48" />
      </div>
      <div class="field">
        <label>Warunki pogodowe</label>
        <input class="field-line" type="text" id="f-weather" placeholder="np. słonecznie, sucho / po deszczu" />
      </div>
    </div>
    <div class="field-row cols-1" style="margin-top: 6px;">
      <div class="field">
        <label>Numer protokołu</label>
        <input class="field-line" type="text" id="f-protocol" style="max-width: 240px;" />
      </div>
    </div>
  </div>

  <!-- 2. OCENA STANU -->
  <div class="section">
    <div class="section-title">2. Ocena stanu trasy</div>
    <div class="status-scale">
      <input class="status-option" type="radio" name="status" id="s1" value="1">
      <label for="s1"><span class="num">1</span><span class="desc">Idealny<br>Brak uwag</span></label>
      <input class="status-option" type="radio" name="status" id="s2" value="2">
      <label for="s2"><span class="num">2</span><span class="desc">Dobry<br>Drobne usterki</span></label>
      <input class="status-option" type="radio" name="status" id="s3" value="3">
      <label for="s3"><span class="num">3</span><span class="desc">Wymaga uwagi<br>Planowa naprawa</span></label>
      <input class="status-option" type="radio" name="status" id="s4" value="4">
      <label for="s4"><span class="num">4</span><span class="desc">Zły<br>Pilna interwencja</span></label>
      <input class="status-option" type="radio" name="status" id="s5" value="5">
      <label for="s5"><span class="num">5</span><span class="desc">Zamknięta<br>Zakaz jazdy</span></label>
    </div>
  </div>

  <!-- 3. OPIS STANU -->
  <div class="section">
    <div class="section-title">3. Opis stanu – obserwacje</div>
    <div class="field-row cols-1">
      <div class="field">
        <label>Szczegółowy opis stanu nawierzchni i elementów trasy</label>
        <textarea class="field-area" id="f-condition" style="min-height:90px"
          placeholder="Erozja, podmycia, połomy, problem z odwodnieniem…"></textarea>
      </div>
    </div>
  </div>

  <!-- 4. WYKONANE PRACE -->
  <div class="section">
    <div class="section-title">4. Wykonane / zlecone prace</div>
    <div class="works-grid">
      <input class="work-option" type="checkbox" id="w1" value="Sprzątanie">
      <label for="w1">Sprzątanie</label>
      <input class="work-option" type="checkbox" id="w13" value="Dmuchanie">
      <label for="w13">Dmuchanie</label>
      <input class="work-option" type="checkbox" id="w14" value="Koszenie">
      <label for="w14">Koszenie</label>
      <input class="work-option" type="checkbox" id="w3" value="Naprawa bandy / przeszkody">
      <label for="w3">Naprawa bandy / przeszkody</label>
      <input class="work-option" type="checkbox" id="w4" value="Drenaż / odprowadzenie wody">
      <label for="w4">Drenaż / odprowadzenie wody</label>
      <input class="work-option" type="checkbox" id="w5" value="Usunięcie połomów i gałęzi">
      <label for="w5">Usunięcie połomów i gałęzi</label>
      <input class="work-option" type="checkbox" id="w6" value="Ubicie nawierzchni">
      <label for="w6">Ubicie nawierzchni</label>
      <input class="work-option" type="checkbox" id="w10" value="Interwencja pilna – zamknięcie">
      <label for="w10">Interwencja pilna – zamknięcie</label>
      <input class="work-option" type="checkbox" id="w11" value="Dokumentacja – tylko obserwacja">
      <label for="w11">Dokumentacja – obserwacja</label>
      <input class="work-option" type="checkbox" id="w12" value="Inne (opis poniżej)">
      <label for="w12">Inne (opis poniżej)</label>
    </div>
    <div class="field-row cols-1" style="margin-top: 10px;">
      <div class="field">
        <label>Opis prac / uwagi / zlecenia do kolejnej ekipy</label>
        <textarea class="field-area" id="f-works-notes"
          placeholder="Szczegóły wykonanych prac, materiały użyte, co zostało do zrobienia, szacowany czas…"></textarea>
      </div>
    </div>
  </div>

  <!-- 5. DOKUMENTACJA FOTOGRAFICZNA -->
  <div class="section" id="section-photos">
    <div class="section-title">5. Dokumentacja fotograficzna</div>
    <div class="photo-section" id="photoSection"></div>
  </div>

  <div class="protocol-num" id="protocolDisplay"></div>
</div>

<script>
// Globalny "siatka bezpieczeństwa": jeśli cokolwiek w skrypcie wyrzuci
// nieobsłużony błąd, pokaż to wyraźnie, zamiast pozwolić stronie "umrzeć"
// po cichu (co wcześniej wyglądało jak całkowicie niereagujące przyciski).
window.addEventListener('error', e => {
  console.error('Globalny błąd:', e.error || e.message);
});
window.addEventListener('unhandledrejection', e => {
  console.error('Nieobsłużone odrzucenie Promise:', e.reason);
});

// Data i numer protokołu
const today = new Date();
const dd = String(today.getDate()).padStart(2,'0');
const mm = String(today.getMonth()+1).padStart(2,'0');
const yyyy = today.getFullYear();
document.getElementById('f-date').value = `${dd}.${mm}.${yyyy}`;
const autoNum = `INS-${yyyy}-${String(Math.floor(Math.random()*900)+100)}`;
document.getElementById('f-protocol').value = autoNum;
document.getElementById('protocolDisplay').textContent = `Protokół nr ${autoNum}`;
document.getElementById('f-protocol').addEventListener('input', function() {
  document.getElementById('protocolDisplay').textContent = this.value ? `Protokół nr ${this.value}` : '';
});

// Sloty zdjęć
const photoSection = document.getElementById('photoSection');
for (let i = 0; i < 6; i++) {
  const slot = document.createElement('div');
  slot.className = 'photo-slot';
  slot.id = `slot-${i}`;
  slot.innerHTML = `
    <div class="photo-image-area">
      <input type="file" accept="image/*,.heic,.heif" onchange="loadPhoto(event,${i})">
      <img id="img-${i}" src="" alt="">
      <div class="photo-placeholder">
        <div class="icon">📷</div>
        <div class="txt">Dotknij aby dodać<br>zdjęcie ${i+1}</div>
      </div>
    </div>
    <input class="photo-caption-input" id="cap-${i}" type="text" placeholder="Opis zdjęcia…" onclick="event.stopPropagation()">
  `;
  photoSection.appendChild(slot);
  slot.addEventListener('dragover', e => { e.preventDefault(); slot.style.borderColor='#e85d04'; });
  slot.addEventListener('dragleave', () => { slot.style.borderColor=''; });
  slot.addEventListener('drop', e => {
    e.preventDefault(); slot.style.borderColor='';
    const file = e.dataTransfer.files[0];
    const looksLikeImage = file && (file.type.startsWith('image/') || isHeicFile(file));
    if (looksLikeImage) applyPhoto(file, i);
  });
}

function loadPhoto(event, idx) {
  const file = event.target.files[0];
  if (file) applyPhoto(file, idx);
  event.target.value = ''; // pozwól wybrać ten sam plik ponownie po usunięciu
}

function isHeicFile(file) {
  const name = (file.name || '').toLowerCase();
  const type = (file.type || '').toLowerCase();
  return name.endsWith('.heic') || name.endsWith('.heif') ||
         type === 'image/heic' || type === 'image/heif';
}

// heic2any zawiera ~600KB WebAssembly (dekoder libheif). Ładujemy go leniwie,
// tylko gdy faktycznie trafi się plik HEIC — żeby brak/słabe łącze w terenie
// nie blokowało wczytania całej resztki strony, jeśli HEIC w ogóle nie wystąpi.
let heic2anyLoadPromise = null;
function loadHeic2Any() {
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (heic2anyLoadPromise) return heic2anyLoadPromise;

  heic2anyLoadPromise = new Promise((resolve, reject) => {
    const timeoutId = setTimeout(() => {
      reject(new Error('Przekroczono czas wczytywania konwertera HEIC (sprawdź połączenie z internetem).'));
    }, 15000);

    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    script.onload = () => {
      clearTimeout(timeoutId);
      if (window.heic2any) resolve(window.heic2any);
      else reject(new Error('Konwerter HEIC wczytał się niepoprawnie.'));
    };
    script.onerror = () => {
      clearTimeout(timeoutId);
      reject(new Error('Nie udało się wczytać konwertera HEIC (sprawdź połączenie z internetem).'));
    };
    document.head.appendChild(script);
  });

  return heic2anyLoadPromise;
}

async function applyPhoto(file, idx) {
  const slot = document.getElementById(`slot-${idx}`);

  // Telefony (głównie iPhone) potrafią dawać zdjęcia w formacie HEIC, którego
  // żadna przeglądarka oprócz Safari nie umie wyświetlić w <img>. Konwertujemy
  // taki plik na JPEG po stronie klienta, zanim spróbujemy go pokazać.
  let workingFile = file;
  if (isHeicFile(file)) {
    slot.classList.add('converting');
    try {
      const heic2anyFn = await loadHeic2Any();
      const convertedBlob = await heic2anyFn({ blob: file, toType: 'image/jpeg', quality: 0.85 });
      workingFile = convertedBlob instanceof Blob ? convertedBlob : convertedBlob[0];
    } catch (err) {
      slot.classList.remove('converting');
      alert('Nie udało się przekonwertować zdjęcia HEIC: ' + err.message + '\n\nMożesz też zmienić format aparatu na "Najbardziej kompatybilny" w ustawieniach telefonu (Ustawienia → Aparat → Formaty), wtedy zdjęcia będą zapisywane jako JPEG.');
      return;
    }
    slot.classList.remove('converting');
  }

  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById(`img-${idx}`);
    const tempImg = new Image();
    tempImg.onload = () => {
      const imageArea = slot.querySelector('.photo-image-area');
      const areaW = imageArea.clientWidth;
      const areaH = imageArea.clientHeight;
      const natW = tempImg.naturalWidth;
      const natH = tempImg.naturalHeight;
      const scale = Math.min(areaW / natW, areaH / natH);
      img.style.width = Math.round(natW * scale) + 'px';
      img.style.height = Math.round(natH * scale) + 'px';
      img.src = ev.target.result;
      img.style.display = 'block';
      slot.classList.add('has-photo');
    };
    tempImg.onerror = () => {
      alert('Nie udało się wczytać tego zdjęcia. Spróbuj innego pliku.');
    };
    tempImg.src = ev.target.result;
  };
  reader.onerror = () => {
    alert('Nie udało się odczytać pliku.');
  };
  reader.readAsDataURL(workingFile);
}

// Generowanie PDF przez html2canvas + jsPDF
// Wrapper wywoływany bezpośrednio z onclick — zapewnia, że NIGDY nie zostaniemy
// w ciszy bez żadnej reakcji, nawet jeśli biblioteki z CDN się nie wczytały
// (np. wolne łącze, blokada sieciowa) albo coś wywali błąd przed pierwszym await.
function handlePrintClick() {
  if (typeof window.jspdf === 'undefined') {
    alert('Biblioteka do generowania PDF nie wczytała się poprawnie (sprawdź połączenie z internetem) i odśwież stronę.');
    return;
  }
  if (typeof html2canvas === 'undefined') {
    alert('Biblioteka do renderowania strony nie wczytała się poprawnie (sprawdź połączenie z internetem) i odśwież stronę.');
    return;
  }
  try {
    generatePDF();
  } catch (err) {
    alert('Nieoczekiwany błąd: ' + err.message);
  }
}

async function generatePDF() {
  const spinner = document.getElementById('spinner');
  spinner.classList.add('active');

  // Safari na iOS blokuje window.open(), jeśli nie następuje on synchronicznie
  // z kliknięciem użytkownika. Otwieramy więc puste okno NATYCHMIAST (zanim
  // jakikolwiek await odda kontrolę), a docelowy URL z PDF wstawimy do niego później.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let preOpenedWindow = null;
  if (isIOS) {
    preOpenedWindow = window.open('', '_blank');
  }

  // chwilowo schowaj przyciski żeby nie weszły do screenshota
  document.querySelector('.print-bar').style.display = 'none';

  const doc = document.getElementById('doc');
  const emptySlots = Array.from(doc.querySelectorAll('.photo-slot'))
    .filter(s => !s.classList.contains('has-photo'));
  const anyPhoto = doc.querySelectorAll('.photo-slot.has-photo').length > 0;
  const photoSectionEl = document.getElementById('section-photos');

  // html2canvas renderuje pola <input>/<textarea> niewiarygodnie (tekst bywa
  // ucięty lub w ogóle nie pojawia się na zrzucie). Żeby to obejść, na czas
  // renderu zamieniamy każde pole na statyczny <div> z tą samą wartością,
  // a po zrzucie wracamy do normalnych, edytowalnych pól.
  const swappedFields = [];
  function swapFieldsForRender() {
    doc.querySelectorAll('input[type="text"], textarea').forEach(field => {
      const value = field.value;
      const placeholder = field.placeholder || '';
      const isEmpty = !value;
      const stand = document.createElement('div');
      stand.textContent = isEmpty ? '' : value;
      // skopiuj kluczowe style wizualne, żeby tekst wyglądał identycznie
      const cs = window.getComputedStyle(field);
      stand.style.font = cs.font;
      stand.style.color = isEmpty ? '#bbb' : cs.color;
      stand.style.padding = cs.padding;
      stand.style.margin = cs.margin;
      stand.style.textAlign = cs.textAlign;
      stand.style.whiteSpace = field.tagName === 'TEXTAREA' ? 'pre-wrap' : 'nowrap';
      stand.style.overflow = 'hidden';
      stand.style.width = cs.width;
      stand.style.minHeight = field.tagName === 'TEXTAREA' ? cs.minHeight : 'auto';
      stand.style.borderBottom = field.classList.contains('field-line') ? cs.borderBottom : 'none';
      stand.style.border = field.tagName === 'TEXTAREA' ? cs.border : (field.classList.contains('field-line') ? 'none' : cs.border);
      stand.style.borderRadius = cs.borderRadius;
      stand.style.background = cs.backgroundColor;
      stand.style.boxSizing = 'border-box';
      stand.className = 'pdf-field-stand';
      if (isEmpty && placeholder) {
        stand.textContent = placeholder;
      }
      field.style.display = 'none';
      field.insertAdjacentElement('afterend', stand);
      swappedFields.push({ field, stand });
    });
  }
  function restoreFieldsAfterRender() {
    swappedFields.forEach(({ field, stand }) => {
      stand.remove();
      field.style.display = '';
    });
    swappedFields.length = 0;
  }

  try {
    // Schowaj puste sloty na zdjęcia (te bez wgranej fotografii) — nie mają się pojawiać w PDF
    emptySlots.forEach(s => s.style.display = 'none');
    // Jeśli żaden slot ze zdjęciem nie istnieje, schowaj też cały tytuł sekcji 5
    if (!anyPhoto) photoSectionEl.style.display = 'none';

    swapFieldsForRender();

    // Zbierz "bezpieczne" granice (góra/dół elementów, których nie wolno przecinać)
    // względem górnej krawędzi #doc, w pikselach CSS (przed skalą html2canvas).
    const docRect = doc.getBoundingClientRect();
    const noBreakSelectors = '.section, .photo-slot, .field-row, .status-scale, .works-grid';
    const safeBoundaries = new Set([0]);
    doc.querySelectorAll(noBreakSelectors).forEach(el => {
      const r = el.getBoundingClientRect();
      safeBoundaries.add(Math.round(r.top - docRect.top));
      safeBoundaries.add(Math.round(r.bottom - docRect.top));
    });
    const sortedBoundaries = Array.from(safeBoundaries).sort((a,b) => a-b);

    // Wymuszony podział strony: sekcja 5 (zdjęcia) zawsze zaczyna nową stronę,
    // jeśli rzeczywiście jest widoczna (ma jakieś zdjęcie).
    let forcedBreakY = null;
    if (anyPhoto) {
      const pr = photoSectionEl.getBoundingClientRect();
      forcedBreakY = Math.round(pr.top - docRect.top);
    }

    const canvas = await html2canvas(doc, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false
    });

    // Przywróć puste sloty, sekcję 5 i pola formularza w żywym widoku (po wykonaniu zrzutu)
    emptySlots.forEach(s => s.style.display = '');
    if (!anyPhoto) photoSectionEl.style.display = '';
    restoreFieldsAfterRender();

    const cssToCanvasScale = canvas.width / docRect.width;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const pageW = 210;
    const pageH = 297;
    const margin = 8;
    const contentW = pageW - margin * 2;
    const imgW = canvas.width;
    const imgH = canvas.height;

    const pdfImgW = contentW;
    const pdfImgH = (imgH / imgW) * contentW; // pełna wysokość obrazu w mm po skalowaniu do A4

    const maxSliceHmm = pageH - margin * 2;

    // Znajdź najbliższą bezpieczną granicę (w px canvasu) nie dalej niż maxSrcY,
    // ale jak najbliżej niej (cofamy się, żeby nie przeciąć elementu).
    function nearestSafeCanvasY(targetCanvasY) {
      let best = 0;
      for (const b of sortedBoundaries) {
        const canvasB = b * cssToCanvasScale;
        if (canvasB <= targetCanvasY) {
          best = canvasB;
        } else break;
      }
      return best;
    }

    const forcedBreakCanvasY = forcedBreakY !== null ? forcedBreakY * cssToCanvasScale : null;

    let yPos = 0; // w mm (skala docelowa pdfImgH)
    let pageYOffset = margin;
    let firstPage = true;
    let forcedBreakUsed = false;

    while (yPos < pdfImgH - 0.5) {
      if (!firstPage) {
        pdf.addPage();
        pageYOffset = margin;
      }
      firstPage = false;

      const idealEndMm = Math.min(yPos + maxSliceHmm, pdfImgH);
      const idealEndCanvasY = (idealEndMm / pdfImgH) * imgH;
      const startCanvasY = (yPos / pdfImgH) * imgH;

      let endCanvasY = idealEndCanvasY;

      // Wymuszony podział przed sekcją zdjęć — ma priorytet, użyj go gdy wypada w tym kawałku
      if (!forcedBreakUsed && forcedBreakCanvasY !== null &&
          forcedBreakCanvasY > startCanvasY && forcedBreakCanvasY < idealEndCanvasY) {
        endCanvasY = forcedBreakCanvasY;
        forcedBreakUsed = true;
      } else if (idealEndMm < pdfImgH - 0.5) {
        // W przeciwnym razie szukaj najbliższego bezpiecznego miejsca podziału
        const safeY = nearestSafeCanvasY(idealEndCanvasY);
        if (safeY > startCanvasY + (idealEndCanvasY - startCanvasY) * 0.5) {
          endCanvasY = safeY;
        }
      }

      const srcH = endCanvasY - startCanvasY;
      const sliceH = (srcH / imgH) * pdfImgH;

      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = imgW;
      sliceCanvas.height = srcH;
      const ctx = sliceCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, imgW, srcH);
      ctx.drawImage(canvas, 0, startCanvasY, imgW, srcH, 0, 0, imgW, srcH);
      const sliceData = sliceCanvas.toDataURL('image/jpeg', 0.92);

      pdf.addImage(sliceData, 'JPEG', margin, pageYOffset, pdfImgW, sliceH);
      yPos += sliceH;
    }

    // Nazwa pliku z trasą i datą
    const trail = document.getElementById('f-trail').value.trim().replace(/\s+/g,'_') || 'trasa';
    const dateStr = document.getElementById('f-date').value.replace(/\./g,'-');
    const filename = `inspekcja_${trail}_${dateStr}.pdf`;

    const blob = pdf.output('blob');

    if (isIOS) {
      // Wykorzystujemy okno otwarte SYNCHRONICZNIE na początku funkcji
      // (zanim jakikolwiek await zdążył oddać kontrolę) — Safari na iOS
      // blokuje window.open() wywołane poza bezpośrednim gestem kliknięcia,
      // dlatego nie otwieramy nowego okna teraz, tylko przekierowujemy to gotowe.
      const url = URL.createObjectURL(blob);
      if (preOpenedWindow && !preOpenedWindow.closed) {
        preOpenedWindow.location.href = url;
      } else {
        // Okno zostało zablokowane lub zamknięte przez użytkownika — spróbuj jeszcze raz
        const win = window.open(url, '_blank');
        if (!win) {
          alert('Przeglądarka zablokowała otwarcie PDF. Zezwól na wyskakujące okna dla tej strony i spróbuj jeszcze raz.');
        }
      }
      // nie zwalniamy URL od razu — Safari potrzebuje go żywego dopóki karta jest otwarta
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else if (navigator.share && navigator.canShare) {
      // Android / inne z Web Share API — spróbuj natywnego "Udostępnij"
      const file = new File([blob], filename, { type: 'application/pdf' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
        } catch (shareErr) {
          downloadBlob(blob, filename);
        }
      } else {
        downloadBlob(blob, filename);
      }
    } else {
      downloadBlob(blob, filename);
    }

  } catch(err) {
    if (preOpenedWindow && !preOpenedWindow.closed) preOpenedWindow.close();
    alert('Błąd generowania PDF: ' + err.message);
  } finally {
    emptySlots.forEach(s => s.style.display = '');
    if (!anyPhoto) photoSectionEl.style.display = '';
    restoreFieldsAfterRender();
    document.querySelector('.print-bar').style.display = '';
    spinner.classList.remove('active');
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 3000);
}

function clearForm() {
  if (!confirm('Wyczyścić cały formularz?')) return;
  document.getElementById('f-date').value = `${dd}.${mm}.${yyyy}`;
  document.getElementById('f-protocol').value = autoNum;
  ['f-inspector','f-trail','f-section','f-weather','f-condition','f-works-notes']
    .forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('input[name="status"]').forEach(r => r.checked = false);
  document.querySelectorAll('.work-option').forEach(c => c.checked = false);
  for (let i = 0; i < 6; i++) {
    const img = document.getElementById(`img-${i}`);
    img.style.display = 'none';
    img.style.width = '';
    img.style.height = '';
    img.src = '';
    document.getElementById(`cap-${i}`).value = '';
    document.getElementById(`slot-${i}`).classList.remove('has-photo');
  }
}
</script>
</body>
